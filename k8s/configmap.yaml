apiVersion: v1
kind: ConfigMap
metadata:
  name: connected-energy-config
  namespace: connected-energy-dev
  labels:
    app: connected-energy
    environment: dev
data:
  APP_NAME: "IoT Energy Monitor"
  APP_ENV: "development"
  APP_DEBUG: "true"
  APP_TIMEZONE: "UTC"
  LOG_CHANNEL: "stack"
  LOG_LEVEL: "debug"

  DB_CONNECTION: "mysql"
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_DATABASE: "iot_energy_monitor"

  MQTT_HOST: "mqtt-service"
  MQTT_PORT: "1883"
  MQTT_CLIENT_ID: "iot-energy-monitor-backend"

  SESSION_DRIVER: "database"
  SESSION_LIFETIME: "120"
  QUEUE_CONNECTION: "database"
  CACHE_STORE: "database"

  ENERGY_MAX_INTEGRATION_GAP_SECONDS: "300"
